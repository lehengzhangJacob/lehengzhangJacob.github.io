locale: "en-US"
site_theme: "default"
title: "Leheng Zhang"
title_separator: "-"
name: &name "Leheng Zhang"
description: &description "Undergraduate student in Computer Science at South China Normal University."
url: https://lehengzhangjacob.github.io
baseurl: ""
repository: "lehengzhangJacob/lehengzhangJacob.github.io"
remote_theme: academicpages/academicpages

author:
  avatar: "profile.jpg"
  name: "Leheng Zhang"
  bio: "Senior, Computer Science, SCNU"
  location: "Guangzhou, China"
  employer: "South China Normal University"
  email: "lehengzhang@m.scnu.edu.cn"
  googlescholar: "https://scholar.google.com/citations?user=WhIDZngAAAAJ&hl=en"
  github: "lehengzhangJacob"

publication_category:
  conferences:
    title: "Conference Papers"
  manuscripts:
    title: "Journal Articles and Manuscripts"

teaser:
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false
comments:
  provider: false
atom_feed:
  hide: true

og_image: /images/profile.jpg
og_description: "Personal academic homepage of Leheng Zhang."

analytics:
  provider: false

include:
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
  - all manuscripts
  - Jacob_cv_ppt.pptx
  - "Leheng Zhang CV.docx"
  - "Leheng Zhang CV.pdf"
  - "张乐桁 个人简历.pdf"
  - "张乐桁 自我介绍 ppt.pptx"
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: false
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-include-cache
  - jekyll-remote-theme
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-include-cache
  - jekyll-remote-theme
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
